version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - uploads_data:/app/uploads
      - db_data:/app/data
    environment:
      - DATABASE_URL=sqlite:////app/data/pw_qa.db
      - CACHE_DIR=/app/data/.cache
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend

volumes:
  uploads_data:
  db_data:
