[project]
name = "pw-qa-sales-agent-backend"
version = "1.0.0"
description = "AI Counselling Call QA Platform backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.28.0",
    "sarvamai>=0.1.33a3",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "google-genai>=0.1.0",
    "psycopg[binary]>=3.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as evaluation regression tests (deselect with '-m not eval')",
]
